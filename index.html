<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnGeo 2.0 - Geography Trivia Games</title>
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/game.css">
    <link rel="stylesheet" href="styles/account.css">
    <link rel="icon" href="images/icon.png">
</head>
<body>
    <header>
        <h1>SnGeo 2.0</h1>
        <p>Fun Geography Games - Upgraded</p>
    </header>
    <div id="account">
        <p>Currently not logged in</p>
        <div>
            <button id="sign-up">Sign Up</button>
            <button id="log-in">Log In</button>
            <button id="profile">Profile</button>
            <button id="log-out">Log Out</button>
        </div>
    </div>
    <div id="account-overlay">
        <div id="overlay-div">
            <h2></h2>
            <input id="username" placeholder="Enter username..." type="text">
            <input id="pwd" placeholder="Enter password..." type="password">
            <button id="submit">Submit</button>
            <button id="back">Go Back</button>
            <p id="status">...</p>
        </div>
    </div>

    <main>
        <h2>Pick a game!</h2>
        <div>
            
        </div>
    </main>

    <div id="game">
        <h2></h2>
        <p id="desc"></p>
        <p id="help"></p>
        <div id="controls"></div>
        <div id="field">
            <div id="population">
                <h2></h2>
                <div>
                    <input type="number">
                    <select>
                        <option>K</option>
                        <option>M</option>
                        <option>B</option>
                    </select>
                    <button>Guess</button>
                </div>
            </div>
        </div>
    </div>
    <script src="components/game-card/game-card.js"></script>
    <script src="scripts/countries.js"></script>
    <script src="scripts/game-types.js"></script>
    <script src="scripts/state.js"></script>
    <script src="scripts/store.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/account.js"></script>
    <script src="scripts/population.js"></script>
    <script src="scripts/area.js"></script>
</body>
</html>
